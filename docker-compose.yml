services:
  kafka:
    image: apache/kafka:4.2.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_KRAFT_MODE: "true"
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data


  timescaledb:
    image: timescale/timescaledb:2.25.1-pg18
    ports:
      - "5433:5432" # temporary port mapping for dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpostgres
      POSTGRES_DB: db
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d


  # mongodb:
  #   image: mongo:8.2.5
  #   ports:
  #     - "27018:27017" # temporary port mapping for dev
  #   environment:
  #     MONGO_INITDB_ROOT_USERNAME: mongodb
  #     MONGO_INITDB_ROOT_PASSWORD: secretmongodb
  #   volumes:
  #     - mongodb-data:/data/db


  go-ingestor:
    build: ./ingestor
    environment:
      - KAFKA_BROKER=kafka:9092
      - FINNHUB_API_KEY=d6inj39r01qm7dc8718gd6inj39r01qm7dc87190
    depends_on:
      - kafka


  python-consumer:
    build: ./consumer
    environment:
      - PYTHONUNBUFFERED=1
      - KAFKA_BROKER=kafka:9092
      - FINNHUB_API_KEY=d6inj39r01qm7dc8718gd6inj39r01qm7dc87190
      - DB_HOST=timescaledb
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASS=secretpostgres
      - DB_NAME=db
    depends_on:
      - kafka
      - timescaledb


  api:
    build: ./api
    ports:
      - "8888:8888"
    environment:
      - DB_HOST=timescaledb
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASS=secretpostgres
      - DB_NAME=db
    depends_on:
      - timescaledb


volumes:
  kafka-data:
  postgres-data:
  # mongodb-data:
