services:
  kafka:
    image: apache/kafka:4.2.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_KRAFT_MODE: "true"
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s


  db:
    image: timescale/timescaledb:2.25.1-pg18
    ports:
      - "5433:5432" # temporary port mapping for dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpostgres
      POSTGRES_DB: db
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
  

  go-ingestor:
    build: ./ingestor
    environment:
      - KAFKA_BROKER=kafka:9092
      - FINNHUB_API_KEY=xxxxxxxxxx
    depends_on:
      kafka:
        condition: service_healthy 


  python-consumer:
    build: ./consumer
    environment:
      - KAFKA_BROKER=kafka:9092
      - FINNHUB_API_KEY=xxxxxxxxxx
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASS=secretpostgres
      - DB_NAME=db
    depends_on:
      kafka:
        condition: service_healthy
      db:
        condition: service_healthy

  python-alerter:
    build: ./consumer
    command: python alerter.py
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASS=secretpostgres
      - DB_NAME=db
    depends_on:
      db:
        condition: service_healthy


  api:
    build: ./api
    # for testing endpoints
    # ports:
    #   - "8888:8888"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASS=secretpostgres
      - DB_NAME=db
    depends_on:
      db:
        condition: service_healthy

  
  frontend:
    build: ./frontend
    ports:
      - "8501:8501"
    environment:
      - GRAPHQL_API_URL=http://api:8888/graphql
      - LLM_API_KEY=xxxxxxxxxx
      - LLM_PROVIDER_API_URL=https://openrouter.ai/api/v1
      - MODEL_NAME=arcee-ai/trinity-large-preview:free
      - SERPER_API_KEY=xxxxxxxxxx
      - FINNHUB_API_KEY=xxxxxxxxxx
    depends_on:
      - api


volumes:
  kafka-data:
  postgres-data: